name: "Build RuleSet"

on:
  schedule:
    # 每天 20:00 UTC（北京时间次日 04:00）自动更新
    - cron: "0 20 * * *"
  workflow_dispatch:

# 同一时间只允许一个构建，避免两次推送互相覆盖
concurrency:
  group: build-ruleset
  cancel-in-progress: false

jobs:
  update-rule-set:
    name: "Update sing-box rule-set"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Setup sing-box"
        env:
          SING_BOX_VERSION: "1.14.3"
        run: |
          set -Eeuo pipefail
          url="https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}/sing-box_${SING_BOX_VERSION}_linux_amd64.deb"
          wget -O sing-box.deb "$url"
          sudo dpkg -i sing-box.deb
          rm sing-box.deb
          sing-box version

      - name: "Setup python venv"
        run: |
          set -Eeuo pipefail
          python3 -m venv venv
          source venv/bin/activate
          pip3 install -r requirements.txt

      - name: "Update rule-set"
        env:
          # 未配置该 secret 时脚本自动降级：IP-ASN 规则跳过，其余规则照常生成
          MAXMIND_KEY: ${{ secrets.MAXMIND_KEY }}
        run: |
          set -Eeuo pipefail
          source venv/bin/activate
          python3 main.py

      - name: "Compile rule-set"
        run: |
          set -Eeuo pipefail
          bash compile.sh

      - name: "Commit and push"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          rm -rf venv __pycache__
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # 直接使用带 token 的地址推送，避免依赖凭据助手
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          # 提交 rule/ 与源码；构建中间产物由 .gitignore 排除
          git add -A
          if git diff --cached --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "chore: update rule-set $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          # 并发场景下先同步远端，避免非快进推送被拒
          git pull --rebase --autostash origin main
          git push origin main
